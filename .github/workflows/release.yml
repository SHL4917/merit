name: Release MERIT

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: '315532800'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tag and release tree
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path
          import tomllib

          version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          tree = ast.parse(Path('src/merit/__init__.py').read_text(encoding='utf-8'))
          module_version = next(ast.literal_eval(node.value) for node in tree.body
                                if isinstance(node, ast.Assign)
                                and any(isinstance(target, ast.Name) and target.id == '__version__'
                                        for target in node.targets))
          if os.environ['GITHUB_REF_NAME'] != f'v{version}' or module_version != version:
              raise SystemExit('tag, package and module versions must match')
          PY
          git cat-file -e "${GITHUB_SHA}:.github/workflows/merit-validate.yml"
      - name: Build wheel and digest
        shell: bash
        run: |
          python -m pip install build 'setuptools==84.0.0' 'wheel==0.48.0' pyyaml
          python - <<'PY'
          from pathlib import Path
          # Normalize packaged text so Windows preflight and Linux release
          # builds hash the same bytes, regardless of checkout autocrlf.
          paths = [Path('README.md'), Path('pyproject.toml'), *Path('src/merit').rglob('*')]
          for path in paths:
              if path.is_file() and (path.suffix in {'.py', '.json', '.md', '.html', '.toml', '.yml', '.sh'}
                                     or path.name in {'CODEOWNERS', 'pre-commit'}):
                  path.write_bytes(path.read_bytes().replace(b'\r\n', b'\n'))
          PY
          python -m build --wheel --no-isolation
          python - <<'PY'
          import hashlib
          import base64
          import csv
          import io
          from pathlib import Path
          import zipfile
          import yaml

          # Wheel ZIP metadata otherwise differs between Windows preflight
          # and Linux CI. Store identical bytes with fixed portable metadata.
          for wheel in Path('dist').glob('*.whl'):
              canonical = wheel.with_suffix('.canonical')
              with zipfile.ZipFile(wheel) as source, zipfile.ZipFile(canonical, 'w') as target:
                  payload = {name: source.read(name) for name in source.namelist()}
                  record = next(name for name in payload if name.endswith('.dist-info/RECORD'))
                  for name in payload:
                      if name.endswith('.dist-info/METADATA'):
                          payload[name] = payload[name].replace(b'\r\n', b'\n')
                  rows = io.StringIO(newline='')
                  writer = csv.writer(rows, lineterminator='\n')
                  for name, content in sorted(payload.items()):
                      if name != record:
                          digest = base64.urlsafe_b64encode(hashlib.sha256(content).digest()).rstrip(b'=').decode('ascii')
                          writer.writerow((name, 'sha256=' + digest, len(content)))
                  writer.writerow((record, '', ''))
                  payload[record] = rows.getvalue().encode('utf-8')
                  for name in sorted(payload):
                      info = zipfile.ZipInfo(name, (1980, 1, 1, 0, 0, 0))
                      info.create_system = 3
                      info.external_attr = 0o100644 << 16
                      target.writestr(info, payload[name])
              canonical.replace(wheel)
          workflow = yaml.load(Path('.github/workflows/merit-validate.yml').read_text(encoding='utf-8'), Loader=yaml.BaseLoader)
          step = next(step for step in workflow['jobs']['validate']['steps'] if step.get('id') == 'install-merit')
          expected = step['env']['MERIT_WHEEL_SHA256']
          wheels = list(Path('dist').glob('*.whl'))
          if len(wheels) != 1 or hashlib.sha256(wheels[0].read_bytes()).hexdigest() != expected:
              raise SystemExit('built wheel does not match trusted workflow release digest')
          PY
          cd dist
          sha256sum *.whl > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Attach wheel to tagged release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" --notes 'Install the attached wheel only after verifying its pinned SHA-256 digest.'
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" --draft=false
