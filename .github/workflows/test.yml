name: Test MERIT

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test and packaging tools
        run: python -m pip install ".[dev]" build wheel "setuptools>=68"
      - name: Run suite
        run: python -m pytest -q -W error
