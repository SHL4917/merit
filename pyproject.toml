[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "merit"
version = "0.1.4"
description = "Turns meeting transcripts into a git-backed requirements baseline with verbatim, hash-pinned traceability."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "jsonschema",
]

[project.optional-dependencies]
dev = ["pytest", "build", "setuptools==84.0.0", "wheel==0.48.0"]

[project.scripts]
merit = "merit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
merit = ["schemas/*.json", "prompts/*.md", "templates/**", "report/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
